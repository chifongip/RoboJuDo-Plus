control_endpoint: tcp://127.0.0.1:8560

dataset:
  root: record_data/g1_23dof_upper_body
  raw_root: record_data/g1_23dof_upper_body_raw
  repo_id: local/g1_23dof_upper_body
  fps: 30
  codec: libx264
  jpeg_quality: 90
  resume: true

camera:
  type: realsense
  name: head_rgb
  serial_number: "142422250116"
  width: 640
  height: 480
  fps: 30

sync:
  # Use source when recorder and RoboJuDo share a monotonic clock. Use receive
  # when control samples arrive over the network from another machine.
  clock: receive
  max_control_age_ms: 50
  max_camera_delta_ms: 50
  poll_timeout_ms: 10
