# Offline DAgger recorder: RoboJuDo binds control samples on 8562 because
# dex-teleop uses 8560 for expert joint targets.
control_endpoint: tcp://127.0.0.1:8562

dataset:
  # Offline DAgger uses a label-aware dataset schema. Keep it separate from an
  # existing unlabeled base dataset and aggregate both datasets during training.
  root: record_data/g1_23dof_upper_body_pickup_mulcam_dagger
  raw_root: record_data/g1_23dof_upper_body_pickup_mulcam_dagger_raw
  repo_id: local/g1_23dof_upper_body_pickup_mulcam_dagger
  fps: 30
  codec: libx264
  jpeg_quality: 90
  resume: true
  # Offline DAgger keeps the complete rollout and writes per-frame labels.
  dagger_labels: true

# Offline DAgger recorder reuses the already encoded GR00T observation PUB;
# it must not open the three RealSense devices a second time.
cameras:
  - type: zmq
    name: head_rgb
    endpoint: tcp://127.0.0.1:8561
    image_key: ego_view
    encoding: auto
    timestamp_mode: receive
  - type: zmq
    name: left_wrist_rgb
    endpoint: tcp://127.0.0.1:8561
    image_key: left_wrist_view
    encoding: auto
    timestamp_mode: receive
  - type: zmq
    name: right_wrist_rgb
    endpoint: tcp://127.0.0.1:8561
    image_key: right_wrist_view
    encoding: auto
    timestamp_mode: receive

sync:
  clock: receive
  max_control_age_ms: 50
  max_camera_delta_ms: 50
  poll_timeout_ms: 10
