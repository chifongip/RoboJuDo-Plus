control_endpoint: tcp://127.0.0.1:8560

dataset:
  root: record_data/x2_move_box_center
  repo_id: local/x2_move_box_center
  fps: 30
  codec: libx264
  resume: false


cameras:
  - type: ros2
    name: head_rgb
    topic: /aima/hal/sensor/rgbd_head_front/rgb_image
    message_type: raw
    node_name: robojudo_recorder_head_rgb
    qos_reliability: reliable
    qos_depth: 1
    ros_python_executable: /usr/bin/python3
    fps: 30



sync:
  clock: receive
  max_control_age_ms: 50
  poll_timeout_ms: 10
