control_endpoint: tcp://127.0.0.1:8560

dataset:
  root: record_data/x2_pick_up_box_put_down_blue_tray
  repo_id: local/x2_pick_up_box_put_down_blue_tray
  fps: 10
  codec: libx264
  resume: false

