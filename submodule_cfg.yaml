# Configuration file for optional submodules
# Default as minimal installation, with only mujoco_viewer


# For MujocoEnv and Kinematics Visualization
# can be skipped on real robot
mujoco_viewer: 
  install: true
  path: third_party/mujoco_viewer
  patches: 
    # Patch for visualization draw
    - ../patches/mujoco_viewer.patch


# Python binding for Unitree SDK2, https://github.com/HansZ8/unitree_cpp
# need to install Unitree SDK2 first
unitree_cpp:
  install: false
  path: packages/unitree_cpp


# AgiBot X2 pybind backend and SDK
# requires a sourced ROS 2 environment and an active Conda environment
aimdk:
  install: false
  path: packages/aimdk_cpp
  installer: scripts/install_aimdk.py


# Generic ROS 2 Joy subscriber built for the active Python interpreter
ros2_joy_cpp:
  install: false
  path: packages/ros2_joy_cpp
  installer: scripts/install_ros2_joy.py


# XR-based arm and dexterous-hand teleoperation
# installs Conda and pip dependencies into the currently active Conda environment
dex_teleop:
  install: false
  path: third_party/dex_teleop
  installer: scripts/install_dex_teleop.py


# AGILINK OmniHand Python SDK. The installer selects the bundled wheel for
# the active CPython ABI and Linux architecture without modifying /usr/local.
omnihand_sdk:
  install: false
  path: third_party/omnihand_sdk
  installer: scripts/install_omnihand.py


# CASIA Hand-M Python SDK. The editable install builds its bundled C++
# extension for the active Linux architecture and Python environment.
casiahand_sdk:
  install: false
  path: third_party/casiahand_sdk


# For OmniH2O, motionlib controller
phc:
  install: false
  path: third_party/phc
  patches: 
    # Patch for useless import and bugfix
    - ../patches/phc.patch
    # [Optional] Windows Platform patch, for speed up multi-process
    # - ../patches/phc-win.patch 
  addons:
    # Addon for 29 dof g1, as phc only support 23dof version
    - ../patches/phc_addon_g1
  extra_packages:
    - third_party/phc/poselib


# ZED Camera Odometry
zed_proxy:
  install: false
  path: packages/zed_proxy
